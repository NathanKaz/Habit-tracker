appId: com.habittracker.app
productName: Habit Tracker
artifactName: habit-tracker-${version}-${arch}.${ext}
copyright: Copyright © 2026

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json
  - '!**/*.map'
  - '!node_modules/**/{test,__tests__,tests,powered-test,example,examples}/**'
  - '!node_modules/**/*.d.ts'

extraResources:
  - from: build/icons
    to: icons
    filter: ['**/*']

asar: true

linux:
  category: Utility
  icon: build/icons/icon.png
  # Имя исполняемого файла оставляем латиницей: кириллица в путях ломает
  # .desktop-файл и запуск из терминала.
  executableName: habit-tracker
  syncDesktopName: true
  synopsis: Habit tracker with a calendar and streaks
  description: Habit tracker with a calendar, streaks, and access from your phone over the local network.
  target:
    - target: deb
      arch: [x64]
    - target: AppImage
      arch: [x64]
